server:
  port: ${GATEWAY_PORT:8081}

spring:
  application:
    name: health-vault-gateway

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  cloud:
    gateway:
      # Global CORS — handled here so pre-flight requests never reach the Core API
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "http://localhost:*"
              - "http://127.0.0.1:*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
            maxAge: 3600

      routes:
        # --- Auth: login (IP-keyed, tight burst cap — brute-force mitigation) ---
        - id: auth-login
          uri: ${CORE_API_URL:http://localhost:8080}
          predicates:
            - Path=/api/auth/login
            - Method=POST
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: ${GATEWAY_RATE_LOGIN_REPLENISH:1}
                redis-rate-limiter.burstCapacity: ${GATEWAY_RATE_LOGIN_BURST:5}
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"

        # --- Auth: register (IP-keyed, slightly looser) ---
        - id: auth-register
          uri: ${CORE_API_URL:http://localhost:8080}
          predicates:
            - Path=/api/auth/register
            - Method=POST
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: ${GATEWAY_RATE_REGISTER_REPLENISH:2}
                redis-rate-limiter.burstCapacity: ${GATEWAY_RATE_REGISTER_BURST:5}
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"

        # --- Documents: upload (user/IP keyed, prevents mass upload abuse) ---
        - id: documents-upload
          uri: ${CORE_API_URL:http://localhost:8080}
          predicates:
            - Path=/api/documents
            - Method=POST
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: ${GATEWAY_RATE_UPLOAD_REPLENISH:5}
                redis-rate-limiter.burstCapacity: ${GATEWAY_RATE_UPLOAD_BURST:10}
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userOrIpKeyResolver}"

        # --- AI: chat endpoint (user-keyed, LLM calls are expensive — tight cap) ---
        - id: ai-chat
          uri: ${CORE_API_URL:http://localhost:8080}
          predicates:
            - Path=/api/ai/chat
            - Method=POST
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: ${GATEWAY_RATE_AI_CHAT_REPLENISH:2}
                redis-rate-limiter.burstCapacity: ${GATEWAY_RATE_AI_CHAT_BURST:5}
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userOrIpKeyResolver}"

        # --- AI: narration (user-keyed; cached result so tighter cap is fine) ---
        - id: ai-trend
          uri: ${CORE_API_URL:http://localhost:8080}
          predicates:
            - Path=/api/ai/metrics/trend/**
            - Method=GET
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: ${GATEWAY_RATE_AI_TREND_REPLENISH:5}
                redis-rate-limiter.burstCapacity: ${GATEWAY_RATE_AI_TREND_BURST:10}
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userOrIpKeyResolver}"

        # --- Catch-all: proxy all remaining /api/** to Core API without rate limiting ---
        - id: core-api-catchall
          uri: ${CORE_API_URL:http://localhost:8080}
          predicates:
            - Path=/api/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.healthvault.gateway: INFO
