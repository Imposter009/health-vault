name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  BUILD_SHA: ${{ github.sha }}

# ── Unit tests ─────────────────────────────────────────────────────────────────

jobs:

  backend-unit:
    name: Backend unit tests (JaCoCo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Run unit tests with JaCoCo
        # Surefire selects tests not tagged @Tag("integration") by default.
        # JaCoCo prepare-agent is bound to the test phase so coverage is captured.
        run: mvn -B test -Dsurefire.excludedGroups=integration

      - name: Upload JaCoCo HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-jacoco-unit
          path: backend/target/site/jacoco/
          retention-days: 14

  gateway-unit:
    name: Gateway unit tests (JaCoCo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Run unit tests
        run: mvn -B test

      - name: Upload JaCoCo HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gateway-jacoco-unit
          path: gateway/target/site/jacoco/
          retention-days: 14

  frontend-unit:
    name: Frontend unit tests (Karma/Jasmine)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node LTS
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:coverage -- --browsers=ChromeHeadless --watch=false

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 14

  frontend-build:
    name: Frontend production build + lint
    runs-on: ubuntu-latest
    needs: frontend-unit
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node LTS
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (production)
        run: npm run build

      - name: Lint
        run: npm run lint
        continue-on-error: true

# ── Integration tests ──────────────────────────────────────────────────────────

  backend-integration:
    name: Backend integration tests (Testcontainers)
    runs-on: ubuntu-latest
    needs: backend-unit
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      # Testcontainers pulls Docker images — no extra setup needed on ubuntu-latest
      # (Docker daemon is pre-installed).
      - name: Run integration tests
        # failsafe runs classes annotated @Tag("integration") or matching *IT.java
        run: mvn -B verify -Dsurefire.excludedGroups=integration -Dfailsafe.groups=integration
        env:
          # Testcontainers reuse is off in CI (clean state per run)
          TESTCONTAINERS_REUSE_ENABLE: "false"

      - name: Upload JaCoCo HTML report (integration)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-jacoco-integration
          path: backend/target/site/jacoco/
          retention-days: 14

# ── End-to-end tests ───────────────────────────────────────────────────────────

  e2e:
    name: Playwright e2e tests
    runs-on: ubuntu-latest
    needs: [backend-integration, frontend-build]
    steps:
      - uses: actions/checkout@v4

      # Start infrastructure
      - name: Start infra (Postgres, Redis, Kafka, MinIO)
        run: |
          docker compose -f infra/docker/docker-compose.yml up -d \
            postgres redis kafka minio
          # Wait for infra health checks to pass
          docker compose -f infra/docker/docker-compose.yml wait \
            postgres redis minio || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Start backend (core-api)
        working-directory: backend
        run: |
          mvn -B spring-boot:run \
            -Dspring-boot.run.profiles=ci &
          # Poll until the actuator health endpoint is up (max 90 s)
          for i in $(seq 1 18); do
            curl -sf http://localhost:8080/api/actuator/health && break
            sleep 5
          done

      - name: Start gateway
        working-directory: gateway
        run: |
          mvn -B spring-boot:run \
            -Dspring-boot.run.profiles=ci &
          for i in $(seq 1 12); do
            curl -sf http://localhost:8081/actuator/health && break
            sleep 5
          done

      - name: Set up Node LTS
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start Angular dev server
        working-directory: frontend
        run: npm run start &
        env:
          # Skip opening browser in CI
          NG_CLI_ANALYTICS: "false"

      - name: Wait for Angular dev server
        run: |
          for i in $(seq 1 24); do
            curl -sf http://localhost:4200/ && break
            sleep 5
          done

      - name: Run Playwright tests
        working-directory: frontend
        run: npm run e2e
        env:
          BASE_URL: http://localhost:4200
          CI: "true"

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/e2e-report/
          retention-days: 14

# ── Docker image builds ────────────────────────────────────────────────────────

  docker-images:
    name: Build Docker images (no push)
    runs-on: ubuntu-latest
    needs: [backend-integration, frontend-build]
    steps:
      - uses: actions/checkout@v4

      - name: Build core-api image
        run: |
          docker build \
            -t healthvault/core-api:${{ github.sha }} \
            -t healthvault/core-api:latest \
            ./backend

      - name: Build gateway image
        run: |
          docker build \
            -t healthvault/gateway:${{ github.sha }} \
            -t healthvault/gateway:latest \
            ./gateway

      - name: Build frontend image
        run: |
          docker build \
            -t healthvault/frontend:${{ github.sha }} \
            -t healthvault/frontend:latest \
            ./frontend

      # Registry push is intentionally commented out.
      # Uncomment and configure DOCKER_USERNAME / DOCKER_PASSWORD secrets to enable.
      #
      # - name: Push images to registry
      #   run: |
      #     echo "${{ secrets.DOCKER_PASSWORD }}" \
      #       | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
      #     docker push healthvault/core-api:${{ github.sha }}
      #     docker push healthvault/gateway:${{ github.sha }}
      #     docker push healthvault/frontend:${{ github.sha }}

  # ── Full-stack smoke test (docker-compose.ci.yml) ──────────────────────────

  compose-smoke:
    name: docker-compose.ci.yml boot smoke test
    runs-on: ubuntu-latest
    needs: docker-images
    env:
      COMPOSE_FILE: infra/docker/docker-compose.yml:infra/docker/docker-compose.ci.yml
      JWT_SECRET: ci-test-secret-must-be-at-least-32-chars-long
      ENCRYPTION_KEY: "ci-aes-256-key-must-be-32-bytes!"
    steps:
      - uses: actions/checkout@v4

      - name: Boot full stack
        run: |
          BUILD_SHA=${{ github.sha }} \
          docker compose up --build --wait --timeout 300

      - name: Smoke-test frontend
        run: curl -sf http://localhost:80/ | grep -q '<app-root'

      - name: Smoke-test gateway health
        run: curl -sf http://localhost:8081/actuator/health | grep -q '"status":"UP"'

      - name: Smoke-test core-api health
        run: curl -sf http://localhost:8080/api/actuator/health | grep -q '"status":"UP"'

      - name: Tear down
        if: always()
        run: docker compose down -v
