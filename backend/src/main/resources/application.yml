spring:
  application:
    name: healthvault-backend

  # Profile is set via SPRING_PROFILES_ACTIVE env var (or -Dspring-boot.run.profiles=<profile>)
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  # JPA base settings — datasource URL/credentials come from profile-specific YAMLs
  jpa:
    hibernate:
      ddl-auto: none   # Schema is managed exclusively by Flyway
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  # Flyway base config — enabled per-profile, locations always the same
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

server:
  port: 8080
  servlet:
    context-path: /

management:
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true
