# Production profile — ALL credentials must come from environment variables.
# No hardcoded defaults for secrets. Startup fails fast if required vars are missing.
spring:
  datasource:
    url: ${DB_URL}               # e.g. jdbc:postgresql://prod-host:5432/healthvault
    username: ${DB_USERNAME}     # Injected by platform secret manager
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  flyway:
    enabled: true

  jpa:
    show-sql: false

  data:
    redis:
      host: ${REDIS_HOST}             # required in prod — no default
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}    # empty string if no auth (dev); set in prod

# Strict Actuator exposure — health, info, and prometheus (for internal scraping only)
# prometheus is intentionally included here so Prometheus can scrape it.
# In a real prod deployment, restrict scrape access via network policy / reverse proxy auth,
# not by hiding the endpoint (hiding it breaks monitoring).
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never   # No internal detail leaked to unauthenticated callers
  tracing:
    sampling:
      probability: 0.1   # 10% sampling in prod — reduce cost; raise per-incident if needed

logging:
  level:
    root: WARN
    com.healthvault: INFO
