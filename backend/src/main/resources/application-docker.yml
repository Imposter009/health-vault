# Docker Compose profile — hostnames match docker-compose service names.
# Used when backend runs inside the same Docker network as infra containers.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/healthvault}
    username: ${DB_USERNAME:healthvault}
    password: ${DB_PASSWORD:changeme_local_dev}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 20000

  flyway:
    enabled: true

  jpa:
    show-sql: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.healthvault: INFO
