version: "3.9"

# NOTE: Backend (healthvault-backend) and frontend (healthvault-frontend) services are
# intentionally not included in Phase 0. The apps will be containerised in a later phase
# once business logic is in place and CI integration tests are properly configured.
# For now, start the apps locally via mvnw / npm start and point them at these infra services.

networks:
  healthvault-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  kafka_data:

services:

  postgres:
    image: postgres:16
    container_name: healthvault-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-healthvault}
      POSTGRES_USER: ${POSTGRES_USER:-healthvault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_local_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - healthvault-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-healthvault} -d ${POSTGRES_DB:-healthvault}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7
    container_name: healthvault-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - healthvault-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  minio:
    image: minio/minio
    container_name: healthvault-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin_secret}
    ports:
      - "9000:9000"   # S3-compatible API
      - "9001:9001"   # MinIO web console
    volumes:
      - minio_data:/data
    networks:
      - healthvault-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Apache Kafka in KRaft mode (no Zookeeper).
  # Single-broker local dev setup — 1 partition per topic.
  # NOTE: Before scaling horizontally, increase partition count on document.uploaded
  # and document.processed topics and raise replication factor to match broker count.
  kafka:
    image: bitnami/kafka:3.7
    container_name: healthvault-kafka
    environment:
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: "broker,controller"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      # Backend runs on the host, so advertise localhost:9092 (mapped port).
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      # Topics created by Spring NewTopic beans on application startup; no auto-creation.
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_CFG_LOG_RETENTION_HOURS: "168"
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/bitnami/kafka
    networks:
      - healthvault-net
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --list --bootstrap-server localhost:9092 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s
