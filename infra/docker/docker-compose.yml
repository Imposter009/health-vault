version: "3.9"

# NOTE: Backend (healthvault-backend) and frontend (healthvault-frontend) services are
# intentionally not included in Phase 0. The apps will be containerised in a later phase
# once business logic is in place and CI integration tests are properly configured.
# For now, start the apps locally via mvnw / npm start and point them at these infra services.

networks:
  healthvault-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  kafka_data:
  prometheus_data:
  grafana_data:

services:

  postgres:
    image: postgres:16
    container_name: healthvault-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-healthvault}
      POSTGRES_USER: ${POSTGRES_USER:-healthvault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_local_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - healthvault-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-healthvault} -d ${POSTGRES_DB:-healthvault}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7
    container_name: healthvault-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - healthvault-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  minio:
    image: minio/minio
    container_name: healthvault-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin_secret}
    ports:
      - "9000:9000"   # S3-compatible API
      - "9001:9001"   # MinIO web console
    volumes:
      - minio_data:/data
    networks:
      - healthvault-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Apache Kafka in KRaft mode (no Zookeeper).
  # Single-broker local dev setup — 1 partition per topic.
  # NOTE: Before scaling horizontally, increase partition count on document.uploaded
  # and document.processed topics and raise replication factor to match broker count.
  kafka:
    image: bitnami/kafka:3.7
    container_name: healthvault-kafka
    environment:
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: "broker,controller"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      # Backend runs on the host, so advertise localhost:9092 (mapped port).
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      # Topics created by Spring NewTopic beans on application startup; no auto-creation.
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_CFG_LOG_RETENTION_HOURS: "168"
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/bitnami/kafka
    networks:
      - healthvault-net
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --list --bootstrap-server localhost:9092 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s

  # ── Observability stack ──────────────────────────────────────────────────────

  # Prometheus scrapes Core API (host:8080) and gateway (host:8081).
  # host.docker.internal resolves to the Docker host machine; on Linux Docker
  # the extra_hosts binding below maps the alias to host-gateway automatically.
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: healthvault-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    networks:
      - healthvault-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy | grep -q 'Prometheus Server is Healthy'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Grafana starts with a pre-provisioned Prometheus datasource and four dashboards.
  # Admin credentials are set via env vars (see .env.example).
  grafana:
    image: grafana/grafana:11.1.0
    container_name: healthvault-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-changeme_grafana}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - healthvault-net
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q '\"database\": \"ok\"'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Zipkin receives OTel spans from both Java modules.
  zipkin:
    image: openzipkin/zipkin:3
    container_name: healthvault-zipkin
    ports:
      - "9411:9411"
    networks:
      - healthvault-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9411/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Redis exporter — exposes Redis metrics at :9121/metrics for Prometheus to scrape.
  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    container_name: healthvault-redis-exporter
    environment:
      REDIS_ADDR: redis://redis:6379
    ports:
      - "9121:9121"
    networks:
      - healthvault-net
    depends_on:
      redis:
        condition: service_healthy
